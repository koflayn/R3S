<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regla de tres simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FA; --grid:#D3DEEA; --ink:#1F3A93; --text:#1B2333; --muted:#5B677A;
  --margin:#D64545; --field:#FFFFFF; --line:#9FB3CC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A23; --grid:#222C3A; --ink:#9DB8FF; --text:#E7ECF4; --muted:#9AA7BB;
    --margin:#FF8080; --field:#1B2330; --line:#3B4A60; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A23; --grid:#222C3A; --ink:#9DB8FF; --text:#E7ECF4; --muted:#9AA7BB;
  --margin:#FF8080; --field:#1B2330; --line:#3B4A60; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--text); background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5;
}
main{
  max-width:560px; margin:0 auto; padding:32px 20px 48px 44px; position:relative;
}
main::before{ /* margen rojo del cuaderno */
  content:""; position:absolute; left:28px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.7;
}
h1{font-family:Kalam,"Comic Sans MS",cursive; font-size:2.6rem; line-height:1.1; margin:0 0 28px; color:var(--ink)}
.board{display:grid; grid-template-columns:auto 1fr 1fr; gap:10px 12px; align-items:center}
.rowlabel{font-family:Kalam,cursive; font-size:1.3rem; color:var(--ink)}
input{
  width:100%; min-width:0; padding:10px 12px; font:400 1.2rem "IBM Plex Sans",sans-serif; color:var(--text);
  background:var(--field); border:1.5px solid var(--line); border-radius:8px;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.answer{
  padding:8px 12px; min-height:52px; display:flex; align-items:center;
  font-family:Kalam,cursive; font-weight:700; font-size:2rem; color:var(--ink);
  border-bottom:3px double var(--ink);
}
.answer.empty{color:var(--muted); font-weight:400}
#steps{margin:28px 0 0; padding:14px 16px; background:var(--field); border:1.5px dashed var(--line); border-radius:8px}
#steps p{margin:0}
#sentence{font-weight:600}
#formula{margin-top:6px; color:var(--muted); font-size:.95rem}
#error{margin:16px 0 0; color:var(--margin); font-weight:600; min-height:1.5em}
@media (max-width:420px){ h1{font-size:2.1rem} main{padding-left:38px} main::before{left:22px} }
</style>
</head>
<body>
<main>
  <h1>Regla de tres simple</h1>
  <div class="board">
    <span class="rowlabel">Si</span>
    <input id="a" inputmode="decimal" placeholder="3" aria-label="Valor A" autocomplete="off">
    <input id="b" inputmode="decimal" placeholder="12" aria-label="Valor B" autocomplete="off">

    <span class="rowlabel">entonces</span>
    <input id="c" inputmode="decimal" placeholder="5" aria-label="Valor C" autocomplete="off">
    <div class="answer empty" id="x" aria-live="polite" aria-label="Resultado">?</div>
  </div>

  <p id="error" role="alert"></p>

  <div id="steps" hidden>
    <p id="sentence"></p>
    <p id="formula"></p>
  </div>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  function num(v){
    var s = String(v).trim().replace(",", ".");
    if (s === "" || isNaN(Number(s))) return null;
    return Number(s);
  }
  function fmt(n){
    return new Intl.NumberFormat("es-ES", {maximumFractionDigits: 4}).format(n);
  }

  function reset(){
    $("x").textContent = "?"; $("x").classList.add("empty");
    $("steps").hidden = true;
  }

  function calc(){
    var a = num($("a").value), b = num($("b").value), c = num($("c").value);
    $("error").textContent = "";

    var filled = [$("a").value, $("b").value, $("c").value].every(function(v){ return v.trim() !== ""; });
    if (!filled){ reset(); return; }
    if (a === null || b === null || c === null){
      reset(); $("error").textContent = "Escribe solo números en los tres campos."; return;
    }
    if (a === 0){
      reset(); $("error").textContent = "No se puede dividir entre cero: revisa el valor A."; return;
    }
    var x = (b * c) / a;

    $("x").textContent = fmt(x); $("x").classList.remove("empty");
    $("sentence").textContent = "Si " + fmt(a) + " ↔ " + fmt(b) + ", entonces " + fmt(c) + " ↔ " + fmt(x) + ".";
    $("formula").textContent = "x = (" + fmt(b) + " × " + fmt(c) + ") ÷ " + fmt(a) + " = " + fmt(x);
    $("steps").hidden = false;
  }

  ["a","b","c"].forEach(function(id){ $(id).addEventListener("input", calc); });
  calc();
})();
</script>
</body>
</html>
